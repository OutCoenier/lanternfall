<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.04 -0.03 56.64 56.64">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".6" r=".75">
      <stop offset="0" stop-color="#4a2210"/>
      <stop offset=".55" stop-color="#1e0f12"/>
      <stop offset="1" stop-color="#0c070b"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset=".6" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e2611c"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c969"/>
      <stop offset="1" stop-color="#9a6420"/>
    </linearGradient>
  </defs>

  <!-- embers trailing above the falling lantern -->
  <circle cx="17" cy="10" r="2.2" fill="#ffcf6a"/>
  <circle cx="11" cy="19" r="1.5" fill="#ff9a3c" opacity=".85"/>
  <circle cx="23" cy="5" r="1.2" fill="#ff9a3c" opacity=".7"/>

  <!-- the lantern, tipping as it falls -->
  <g transform="translate(33 34) scale(1.12) rotate(-16) translate(-34 -32)" stroke="#2a1408" stroke-linejoin="round" stroke-linecap="round">
    <!-- handle ring -->
    <circle cx="34" cy="10.5" r="3.6" fill="none" stroke="url(#brass)" stroke-width="3"/>
    <!-- cap -->
    <path d="M24 18.5 L27.5 13.5 H40.5 L44 18.5 Z" fill="url(#brass)" stroke-width="2.2"/>
    <!-- glass body -->
    <path d="M21.5 18.5 H46.5 L49 41 H19 Z" fill="url(#glass)" stroke-width="2.6"/>
    <!-- cage bars -->
    <path d="M34 18.5 V41 M28 18.5 L26.5 41 M40 18.5 L41.5 41" stroke="#7a3f12" stroke-width="1.6" opacity=".75" fill="none"/>
    <!-- flame -->
    <path d="M34 23 C38.8 28 40.5 31.5 37.3 35.6 C35.8 37.4 32.2 37.4 30.7 35.6 C27.5 31.5 29.2 28 34 23 Z" fill="#fff8dc" stroke="#ff8a2a" stroke-width="1.4"/>
    <!-- base -->
    <rect x="16.5" y="40" width="35" height="6.5" rx="2.2" fill="url(#brass)" stroke-width="2.2"/>
  </g>
</svg>
