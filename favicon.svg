<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".6" r=".75">
      <stop offset="0" stop-color="#4a2210"/>
      <stop offset=".55" stop-color="#1e0f12"/>
      <stop offset="1" stop-color="#0c070b"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset=".6" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e2611c"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c969"/>
      <stop offset="1" stop-color="#9a6420"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- embers trailing above the falling lantern -->
  <circle cx="17" cy="10" r="2.2" fill="#ffcf6a"/>
  <circle cx="11" cy="19" r="1.5" fill="#ff9a3c" opacity=".85"/>
  <circle cx="23" cy="5" r="1.2" fill="#ff9a3c" opacity=".7"/>

  <!-- glow -->
  <circle cx="34" cy="38" r="24" fill="url(#halo)"/>

  <!-- the lantern, tipping as it falls -->
  <g transform="rotate(-16 34 36)" stroke="#2a1408" stroke-linejoin="round" stroke-linecap="round">
    <!-- handle ring -->
    <circle cx="34" cy="10" r="4.2" fill="none" stroke="url(#brass)" stroke-width="3"/>
    <!-- cap -->
    <path d="M25 19 L28 13.5 H40 L43 19 Z" fill="url(#brass)" stroke-width="2"/>
    <!-- glass body -->
    <path d="M23 19 H45 L47.5 47 H20.5 Z" fill="url(#glass)" stroke-width="2.4"/>
    <!-- cage bars -->
    <path d="M34 19 V47 M28.5 19 L27 47 M39.5 19 L41 47" stroke="#7a3f12" stroke-width="1.6" opacity=".75" fill="none"/>
    <!-- flame -->
    <path d="M34 25 C38.5 30.5 40 34.5 37 39 C35.6 41 32.4 41 31 39 C28 34.5 29.5 30.5 34 25 Z" fill="#fff8dc" stroke="#ff8a2a" stroke-width="1.4"/>
    <!-- base -->
    <rect x="18" y="46" width="32" height="6.5" rx="2.2" fill="url(#brass)" stroke-width="2"/>
  </g>
</svg>
